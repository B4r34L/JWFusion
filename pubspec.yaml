name: jw_fusion
description: Merge multiple .jwlibrary backup files into one unified backup without losing data.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite (pure FFI bindings, works on Windows/Android/iOS/macOS)
  sqlite3: ^2.4.6
  # Bundles native sqlite3 binaries for Flutter builds (Android/iOS/macOS/Windows/Linux)
  sqlite3_flutter_libs: ^0.5.24

  # ZIP read/write (.jwlibrary files are ZIP archives) - pure Dart
  archive: '>=3.4.0 <4.0.0'

  # Cross-platform file picking (Windows, Android, iOS, macOS)
  file_picker: ^11.0.2

  # Drag-and-drop files onto the desktop window
  desktop_drop: ^0.7.1
  cross_file: ^0.3.4+2

  # Path handling and platform temp/cache directories
  path: ^1.9.0
  path_provider: ^2.1.4

  # SHA-256 hash for manifest.json integrity field - pure Dart
  crypto: ^3.0.5

  # Persists AppSettings (askUserOnConflict, deviceName) across app restarts
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  file_picker: 12.0.0-beta.7
